# The distribution matrix of the whole chain (moved here from xrdclient): the
# Linux containers (xrddevtools.platforms + packaging/linux.sh: wheel-only
# install, RPM/DEB packages, every hermetic suite), a real NixOS VM, and the
# Homebrew bundles on both macOS architectures. Every repository's source
# is a candidate ref; xrdclient's and xgfalclient's platforms.yml call this
# with their own commit:
#
#   platforms:
#     uses: rob-c/xrd-devtools/.github/workflows/platforms.yml@main
#     with:
#       xrdclient-ref: ${{ github.sha }}
name: Distribution packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      xrdclient-ref:
        description: rob-c/xrdclient candidate ref
        type: string
        default: main
      xgfalclient-ref:
        description: rob-c/xgfalclient candidate ref
        type: string
        default: main
      xrdcore-ref:
        description: rob-c/xrdcore candidate ref (the libraries are built from source until on PyPI)
        type: string
        default: main
      xrdsec-ref:
        description: rob-c/xrdsec candidate ref (the libraries are built from source until on PyPI)
        type: string
        default: main
      xrdhttp-ref:
        description: rob-c/xrdhttp candidate ref (the libraries are built from source until on PyPI)
        type: string
        default: main
      xrdarc-ref:
        description: rob-c/xrdarc candidate ref (its packages are built alongside)
        type: string
        default: main
      devtools-ref:
        description: rob-c/xrd-devtools ref (blank uses the selected workflow ref)
        type: string
        default: ""
  workflow_call:
    inputs:
      xrdclient-ref:
        type: string
        default: main
      xgfalclient-ref:
        type: string
        default: main
      xrdcore-ref:
        type: string
        default: main
      xrdsec-ref:
        type: string
        default: main
      xrdhttp-ref:
        type: string
        default: main
      xrdarc-ref:
        type: string
        default: main
      devtools-ref:
        type: string
        default: main

permissions:
  contents: read

env:
  # A run in this repository tests its own commit; a call from another
  # repository uses the devtools ref it passes (main by default).
  DEVTOOLS_REF: ${{ inputs.devtools-ref || github.sha }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rob-c/xrd-devtools
          persist-credentials: false
          ref: ${{ env.DEVTOOLS_REF }}
      - id: matrix
        run: echo "platforms=$(PYTHONPATH=src python3 -m xrddevtools platforms --list)" >> "$GITHUB_OUTPUT"

  linux:
    needs: matrix
    # Each container runs natively on an x86-64 and on an ARM64 hosted runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    steps:
      - name: the chain and xrd-devtools, side by side
        uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          packages: xrdcore xrdsec xrdhttp xrdclient xgfalclient xrdarc
          xrdcore-ref: ${{ inputs.xrdcore-ref || 'main' }}
          xrdsec-ref: ${{ inputs.xrdsec-ref || 'main' }}
          xrdhttp-ref: ${{ inputs.xrdhttp-ref || 'main' }}
          xrdclient-ref: ${{ inputs.xrdclient-ref || 'main' }}
          xgfalclient-ref: ${{ inputs.xgfalclient-ref || 'main' }}
          xrdarc-ref: ${{ inputs.xrdarc-ref || 'main' }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          path: clients
          install: none
      - name: Rootless container prerequisites
        run: sudo apt-get update && sudo apt-get install -y podman uidmap slirp4netns
      - name: Wheel-only install, native package lifecycle and complete hermetic suites
        run: >-
          PYTHONPATH=clients/xrd-devtools/src python3 -m xrddevtools platforms --engine podman
          --workspace clients --platform '${{ matrix.name }}' --output results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}-${{ matrix.arch }}
          path: results/

  nixos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest, nix-config: ''}
          # The ARM64 hosted runners expose no /dev/kvm. Claiming the feature
          # in the daemon's configuration (a client --option is not honoured
          # by the multi-user daemon) lets the test driver run the same VM
          # under QEMU's software emulation: slower, but a real booted NixOS.
          - {arch: arm64, runner: ubuntu-24.04-arm, nix-config: 'system-features = nixos-test benchmark big-parallel kvm'}
    steps:
      - name: the chain and xrd-devtools, side by side
        uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          packages: xrdcore xrdsec xrdhttp xrdclient xgfalclient xrdarc
          xrdcore-ref: ${{ inputs.xrdcore-ref || 'main' }}
          xrdsec-ref: ${{ inputs.xrdsec-ref || 'main' }}
          xrdhttp-ref: ${{ inputs.xrdhttp-ref || 'main' }}
          xrdclient-ref: ${{ inputs.xrdclient-ref || 'main' }}
          xgfalclient-ref: ${{ inputs.xgfalclient-ref || 'main' }}
          xrdarc-ref: ${{ inputs.xrdarc-ref || 'main' }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          path: clients
          install: none
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: ${{ matrix.nix-config }}
      - name: Record the resolved package set
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version' | tee nixpkgs-version.txt
      # The chain is found as siblings of the xrd-devtools checkout
      # (clients/<name>); building xgfalclient builds the libraries and
      # xrdclient beneath it, each with its own suite.
      - name: Build every package and run its full hermetic test suite
        run: |
          nix-build clients/xrd-devtools/packaging/nix -A xgfalclient
          nix-build clients/xrd-devtools/packaging/nix -A xrdarc
      - name: Real NixOS VM installation and CLI tests
        run: nix-build clients/xrd-devtools/packaging/nix -A nixosTest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-${{ matrix.arch }}
          path: |
            nixpkgs-version.txt
            result/test.html

  homebrew:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: the chain and xrd-devtools, side by side
        uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          packages: xrdcore xrdsec xrdhttp xrdclient xgfalclient xrdarc
          xrdcore-ref: ${{ inputs.xrdcore-ref || 'main' }}
          xrdsec-ref: ${{ inputs.xrdsec-ref || 'main' }}
          xrdhttp-ref: ${{ inputs.xrdhttp-ref || 'main' }}
          xrdclient-ref: ${{ inputs.xrdclient-ref || 'main' }}
          xgfalclient-ref: ${{ inputs.xgfalclient-ref || 'main' }}
          xrdarc-ref: ${{ inputs.xrdarc-ref || 'main' }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          path: clients
          install: none
      - run: brew install python@3.14
      - name: Build platform-specific, compiler-free wheel bundles
        run: |
          brewed_python="$(brew --prefix python@3.14)/bin/python3.14"
          "$brewed_python" -m venv build-env
          build-env/bin/python -m pip install --only-binary=:all: build
          for project in xrdcore xrdsec xrdhttp xrdclient xgfalclient xrdarc; do
            build-env/bin/python -m build --wheel --outdir wheels "clients/$project"
          done
          # The clients' library requirements resolve to the wheels just built.
          build-env/bin/python -m pip download --only-binary=:all: --find-links wheels --dest wheelhouse wheels/*.whl
          PYTHONPATH=clients/xrd-devtools/src build-env/bin/python -m xrddevtools homebrew \
            --wheelhouse wheelhouse --output brew-packages
      - name: Install and test the generated tap formulae
        run: |
          brew tap-new --no-git storage-ci/clients
          cp brew-packages/*.rb "$(brew --repository storage-ci/clients)/Formula/"
          brew install --build-from-source storage-ci/clients/xrdclient storage-ci/clients/xgfalclient storage-ci/clients/xrdarc
          for formula in xrdclient xgfalclient xrdarc; do
            brew test "storage-ci/clients/$formula"
          done
      - name: Exercise every installed command
        # xgfalclient's private virtualenv holds xrdclient and the libraries,
        # but each formula links only its own commands into its keg.
        run: |
          smoke=clients/xrd-devtools/src/xrddevtools/installed_smoke.py
          "$(brew --prefix xgfalclient)/libexec/bin/python" "$smoke" \
            --bin-dir "$(brew --prefix xgfalclient)/bin" \
            --clients xrdclient xgfalclient --client-bin "xrdclient=$(brew --prefix xrdclient)/bin"
          "$(brew --prefix xrdarc)/libexec/bin/python" "$smoke" \
            --bin-dir "$(brew --prefix xrdarc)/bin" --clients xrdarc
      # Each suite's take-over gate finds xrd-devtools as its sibling
      # (clients/xrd-devtools), with radon and complexipy installed here.
      - name: Full hermetic suites using Brew Python
        run: |
          build-env/bin/python -m pip install --only-binary=:all: --find-links wheels wheels/*.whl pytest pytest-cov pytest-timeout pytest-xdist fsspec 'hypothesis>=6.100,<7' 'complexipy>=6,<7' 'radon>=6,<7'
          for project in xrdcore xrdsec xrdhttp xrdclient xgfalclient xrdarc; do
            (cd "clients/$project" && ../../build-env/bin/python -m pytest -q -n 4 -m 'not interop and not parity' --timeout=300 --cov --cov-fail-under=0 --junitxml="../../brew-packages/$project-tests.xml")
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-${{ matrix.os }}
          path: brew-packages/
