[build-system]
# Hatchling 1.32 emits Core Metadata 2.5, which Twine 6.2 cannot validate.
# Keep isolated and CI builds reproducible until the inspection tool catches up.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "xrd-devtools"
dynamic = ["version"]
description = "The tooling of the xrdcore/xrdclient chain: take-over scorecard, maintainability, duplicate and conformance gates, release pre-flight and the distribution packaging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  # The tools run from a checkout (the packaging/ directory lives beside
  # src/), never from an index: PyPI refuses an upload with this classifier.
  "Private :: Do Not Upload",
]
# The metrics behind the scorecard and the maintainability gate, and the
# requirement parser of the release pre-flight. Nothing of the chain: these
# tools read its checkouts and wheels, they never import its packages.
dependencies = [
  "complexipy>=6,<7",
  "packaging>=24",
  "radon>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=2.3,<2.5",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.5",
  "twine>=6,<7",
]

[project.scripts]
xrddevtools = "xrddevtools.cli:main"

[project.urls]
Repository = "https://github.com/rob-c/xrd-devtools"
Issues = "https://github.com/rob-c/xrd-devtools/issues"
Changelog = "https://github.com/rob-c/xrd-devtools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/xrddevtools"]

[tool.hatch.version]
path = "src/xrddevtools/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes ``tests`` a namespace package, so test modules import their
# helpers as ``tests.<module>``; "src" finds the package without installing it.
pythonpath = [".", "src"]
timeout = 120
addopts = "-ra"
# >>> xrddevtools sync: pytest-warnings (generated from xrd-devtools/src/xrddevtools/standard) >>>
# Every warning fails the run, ours and third parties' alike; a test that
# expects one says so with ``pytest.warns``.
filterwarnings = ["error"]
# <<< xrddevtools sync: pytest-warnings <<<

# Every line and branch: these are the gates every other repository trusts.
# >>> xrddevtools sync: coverage (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.coverage.run]
branch = true
source = ["xrddevtools"]
parallel = true

[tool.coverage.report]
# Every line and branch, reached by a test that makes the case happen.
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
# <<< xrddevtools sync: coverage <<<

# >>> xrddevtools sync: ruff (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF",
  # High-confidence security checks. The wider S family cannot tell the
  # protocol-mandated hashes, parsers and subprocesses of a storage client
  # from unsafe application code, so it is reviewed rather than enabled.
  "S102", "S307", "S506", "S602", "S608", "S609", "S701",
  # Banned APIs: the banned-api table.
  "TID251",
]
# No rule is ignored and there are no per-file ignores: old code passes the
# same checks as new code.
ignore = []
# <<< xrddevtools sync: ruff <<<

# The tools read the chain's checkouts and wheels; they never import its
# packages, which may be absent or a different version from the checkout
# being checked. CONTRIBUTING.md explains the list.
# >>> xrddevtools sync: banned-api (generated from xrd-devtools/src/xrddevtools/standard) >>>
# What another part of the chain owns, this repository does not do itself:
# each message names the replacement. No entry is scoped by file and nothing
# is ignored; CONTRIBUTING.md's "Banned APIs" explains each one.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xrdcore".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
"xrdsec".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
"xrdhttp".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
"xrdclient".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
"xgfalclient".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
"xrdarc".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
"xrdwms".msg = "xrd-devtools never imports the chain it checks: read the checkout's files, or run the package in a subprocess"
# <<< xrddevtools sync: banned-api <<<

[tool.ruff.lint.isort]
known-first-party = ["xrddevtools"]
# Test modules import the suite's helpers as ``tests.<module>``: local, sorted last.
known-local-folder = ["tests"]

# >>> xrddevtools sync: mypy (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.mypy]
# 3.11 is the oldest interpreter any supported platform hands a user.
python_version = "3.11"
strict = true
# <<< xrddevtools sync: mypy <<<
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

# >>> xrddevtools sync: mypy-overrides (generated from xrd-devtools/src/xrddevtools/standard) >>>
# Tests may leave a fixture-taking test function unannotated, but its body is
# still checked, so a type error (or an unused ignore) in a test fails too.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# radon 6 ships neither inline types nor a stub package.
[[tool.mypy.overrides]]
module = ["radon.*"]
ignore_missing_imports = true
# <<< xrddevtools sync: mypy-overrides <<<

# >>> xrddevtools sync: complexipy (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.complexipy]
# Every function of every Python file, with no snapshot of old offenders.
paths = ["src", "tests"]
max-complexity-allowed = 15
failed = true
# <<< xrddevtools sync: complexipy <<<
